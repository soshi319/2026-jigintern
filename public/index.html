<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>視聴画面</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/main.js"></script>
  </head>
  <body>
    <h1>視聴画面</h1>
    <div class="layout">
      <div id="video-area" class="box video-area">
        <video id="player" controls playsinline>
          お使いのブラウザは動画再生に対応していません。
        </video>
      </div>
      <div class="side-panel">
        <ul id="comment-area" class="box comment-area"></ul>
        <div id="send-area" class="box send-area">
          <p id="comment-error" class="comment-error" hidden></p>
          <div class="send-row">
            <textarea id="comment-input" rows="1" placeholder="コメントを入力"></textarea>
            <button id="comment-send" type="button">送信</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
