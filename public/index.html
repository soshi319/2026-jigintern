<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>視聴画面</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/main.js"></script>
  </head>
  <body>
    <h1>視聴画面</h1>
    <div class="layout">
      <div id="video-area" class="box video-area">
        <video id="player" controls playsinline>
          お使いのブラウザは動画再生に対応していません。
        </video>
      </div>
      <div class="side-panel">
        <div id="comment-area" class="box comment-area">コメントの表示領域</div>
        <div id="send-area" class="box send-area">コメント・アイテムの送信領域</div>
      </div>
    </div>
  </body>
</html>
