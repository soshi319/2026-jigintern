<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2f2f0" />
    <title>視聴画面</title>
    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">メインコンテンツへスキップ</a>
    <div class="page-header">
      <h1 class="site-logo">
        <img src="/icons/sabila_icon.svg" alt="" width="63" height="42" class="site-logo-icon" />
        <span class="site-logo-text">Sabila</span>
      </h1>
      <div class="page-header-actions">
        <button
          id="shortcut-help-btn"
          type="button"
          class="header-icon-btn"
          aria-label="キーボードショートカット一覧"
          aria-haspopup="dialog"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <rect x="2" y="5" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2" />
            <path
              d="M6 9.5h.01M10 9.5h.01M14 9.5h.01M18 9.5h.01M6 13h.01M10 13h.01M14 13h.01M18 13h.01M8 16.2h8"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <button
          id="theme-toggle-btn"
          type="button"
          class="theme-switch"
          role="switch"
          aria-checked="false"
          aria-label="ダークモードに切り替え"
        >
          <svg class="theme-switch-icon theme-switch-icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="currentColor" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          <span class="theme-switch-track">
            <span class="theme-switch-thumb" aria-hidden="true"></span>
          </span>
          <svg class="theme-switch-icon theme-switch-icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor" />
          </svg>
        </button>
      </div>
    </div>
    <main id="main-content" class="layout">
      <div id="video-area" class="box video-area" tabindex="0">
        <video id="player" playsinline autopictureinpicture>
          お使いのブラウザは動画再生に対応していません。
        </video>
        <button id="video-play-overlay" type="button" class="video-play-overlay" aria-label="再生">
          <svg viewBox="0 0 24 24" width="60" height="60" aria-hidden="true">
            <path
              d="M9 6.5v11l9-5.5z"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <div id="video-buffering-overlay" class="video-buffering-overlay" hidden aria-hidden="true">
          <span class="video-buffering-spinner"></span>
        </div>

        <div id="video-controls-bar" class="video-controls-bar">
          <button id="video-playpause-btn" type="button" class="video-bar-btn" aria-label="再生">
            <svg class="bar-icon icon-play" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M8 5v14l11-7z" fill="currentColor" />
            </svg>
            <svg class="bar-icon icon-pause" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <rect x="6" y="5" width="4" height="14" fill="currentColor" />
              <rect x="14" y="5" width="4" height="14" fill="currentColor" />
            </svg>
          </button>

          <button id="video-mute-btn" type="button" class="video-bar-btn" aria-label="ミュート">
            <svg class="bar-icon icon-volume" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor" />
              <path
                d="M16.5 8.5a5 5 0 0 1 0 7"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
            <svg class="bar-icon icon-muted" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor" />
              <path
                d="M15.5 9.5l5 5m0-5l-5 5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </button>

          <input
            id="video-volume-slider"
            type="range"
            class="video-volume-slider"
            min="0"
            max="1"
            step="0.01"
            value="1"
            aria-label="音量"
          />

          <div class="video-bar-spacer"></div>

          <button
            id="video-pip-btn"
            type="button"
            class="video-bar-btn"
            aria-label="ピクチャーインピクチャーで再生"
            hidden
          >
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <rect x="2" y="4" width="20" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2" />
              <rect x="12" y="11" width="8" height="6" rx="1" fill="currentColor" />
            </svg>
          </button>

          <button id="video-fullscreen-btn" type="button" class="video-bar-btn" aria-label="全画面表示">
            <svg class="bar-icon icon-enter-fullscreen" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <svg class="bar-icon icon-exit-fullscreen" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </div>
      <div class="side-panel">
        <div class="comment-wrapper">
        <div id="comment-panel" class="box comment-panel">
          <div id="comment-header" class="comment-header">
            <button id="comment-toggle-btn" type="button" aria-expanded="true">
              <span class="comment-toggle-arrow" aria-hidden="true"></span>
              コメント
            </button>
            <div id="item-ticker" class="item-ticker"></div>
            <span id="comment-unread-badge" class="comment-unread-badge" hidden>0</span>
          </div>
          <div id="comment-scroll-wrap" class="comment-scroll-wrap">
            <ul id="comment-area" class="comment-area"></ul>
            <button id="comment-jump-btn" class="comment-jump-btn" type="button" hidden>↓ 最新に戻る</button>
          </div>
          <div id="send-area" class="send-area">
            <button id="selected-item-chip" class="selected-item-chip" type="button" aria-label="選択中のアイテム" hidden>
              <img id="selected-item-chip-icon" alt="" />
              <span class="selected-item-chip-remove" aria-hidden="true">×</span>
            </button>
            <p id="comment-error" class="comment-error" role="alert" aria-live="polite" tabindex="-1" hidden></p>
            <div class="send-row">
              <button id="item-toggle-btn" type="button" aria-label="アイテムを選択">
                <svg class="row-icon" viewBox="0 0 512 512" width="18" height="18" aria-hidden="true">
                  <path
                    class="row-icon-fill"
                    d="M128.778,31.389c-3.118,0-5.943,1.667-7.465,4.421L95.432,83.074c-1.302,2.318-1.377,5.076-0.29,7.54
                    c1.162,2.463,3.264,4.205,5.947,4.785l126.422,27.4v-1.812v-1.958v-0.506v-2.392c0.071-0.797,0.146-1.452,0.216-2.178
                    L134.29,33.417C132.768,32.111,130.806,31.389,128.778,31.389z"
                  />

                    d="M235.122,102.138c0.506-0.436,1.016-0.726,1.596-1.087c0.436-0.216,0.871-0.435,1.303-0.651

                  />

                    class="row-icon-fill"
                    d="M284.488,119.029v1.958v1.812l126.423-27.4c2.609-0.58,4.786-2.322,5.872-4.785
                    c1.161-2.464,1.087-5.222-0.216-7.54L390.615,35.81c-1.451-2.754-4.35-4.421-7.469-4.421c-2.028,0-3.985,0.722-5.507,2.028

                  />

                    class="row-icon-fill"
                    d="M305.003,1.593C303.552,0.581,301.885,0,300.147,0c-3.989,0-7.539,2.828-8.339,6.739l-18.919,89.746
                    l-0.651,3.189c0.581,0.216,1.161,0.435,1.738,0.726c0.436,0.216,0.871,0.435,1.306,0.651c0.581,0.362,1.086,0.651,1.597,1.087
                    l2.244-2.393l59.518-62.558c1.738-1.738,2.538-4.206,2.318-6.669c-0.219-2.393-1.522-4.641-3.554-6.088L305.003,1.593z"
                  />
                  <path
                    class="row-icon-fill"
                    d="M448.318,129.032h-163.83h-3.625h-3.624v-4.711v-1.813v-0.145v-2.393v-3.044c0-4.06-2.174-7.61-5.508-9.497

                    c0,18.194,14.859,32.982,33.056,32.982h310.113c18.198,0,32.982-14.788,32.982-32.982V242.263h4.279
                    c12.686,0,22.979-10.222,22.979-22.909V152.01C471.297,139.325,461.003,129.032,448.318,129.032z M236.279,361.437L236.279,361.437
                    h0.003l0,0h39.151h0.121l0,0h0.145v-39.424h-39.417v-0.01H89.634v-79.739h146.344h0.304v79.11l-0.003,0.485h0.003v0.145h39.169

                    h-4.279H275.717h-39.434H67.887h-4.276c-0.654,0-1.161-0.506-1.161-1.162V152.01z"
                  />
                </svg>
              </button>
              <textarea id="comment-input" rows="1" placeholder="コメントを入力" aria-label="コメント入力"></textarea>
              <button id="comment-send" type="button" aria-label="送信">
                <svg class="send-icon" viewBox="0 0 512 512" width="18" height="18" aria-hidden="true">
                  <path
                    class="row-icon-fill"
                    d="M474.444,19.857a20.336,20.336,0,0,0-21.592-2.781L33.737,213.8v38.066l176.037,70.414L322.69,496h38.074l120.3-455.4A20.342,20.342,0,0,0,474.444,19.857ZM337.257,459.693,240.2,310.37,389.553,146.788l-23.631-21.576L215.4,290.069,70.257,232.012,443.7,56.72Z"
                  />
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div id="item-panel" class="item-panel" hidden>
          <div class="item-panel-header">
            <h2>アイテム一覧</h2>
            <button id="item-panel-close-btn" type="button" class="item-panel-close-btn" aria-label="閉じる">×</button>
          </div>
          <div id="item-group-tabs" class="item-group-tabs"></div>
          <div id="item-list"></div>
        </div>
        </div>

        <div id="channel-panel" class="box channel-panel">
          <h2 class="channel-panel-title">チャンネル</h2>
          <div id="channel-tabs" class="channel-tabs"></div>
          <div id="channel-list" class="channel-list"></div>
        </div>
      </div>
    </main>

    <dialog id="shortcut-panel" class="shortcut-panel" aria-labelledby="shortcut-panel-title">
      <div class="shortcut-panel-header">
        <h2 id="shortcut-panel-title">キーボードショートカット</h2>
        <button id="shortcut-panel-close-btn" type="button" class="shortcut-panel-close-btn" aria-label="閉じる">
          ×
        </button>
      </div>
      <div id="shortcut-panel-body" class="shortcut-panel-body"></div>
      <div class="shortcut-panel-footer">
        <p id="shortcut-panel-message" class="shortcut-panel-message" role="status" aria-live="polite" hidden></p>
        <button id="shortcut-reset-btn" type="button" class="shortcut-reset-btn">デフォルトに戻す</button>
      </div>
    </dialog>
  </body>
</html>
